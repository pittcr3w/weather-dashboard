name: Build and Deploy
on:
  push:
    branches: [ master ] # Triggers on pushes to master branch

permissions:
  contents: write # Needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use appropriate Node.js version

      - name: Install Dependencies 🔧
        run: |
          # Make sure we install dev dependencies
          npm ci
          # Explicitly install Vue CLI if needed
          npm install --save-dev @vue/cli-service

      - name: Build 🏗️
        run: |
          # Use npx to run vue-cli-service
          npx vue-cli-service build
        env:
          # Add any environment variables your build needs
          NODE_ENV: production

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder containing built app (default for Vue)
          branch: gh-pages # The branch to deploy to