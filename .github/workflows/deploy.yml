name: Build and Deploy
on:
  push:
    branches: [ master ] # Triggers on pushes to master branch

permissions:
  contents: write # Needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use appropriate Node.js version

      - name: Update Dependencies 🔄
        run: |
          # Instead of npm ci, use npm install to update the lock file
          npm install
          
      - name: Build 🏗️
        run: |
          npm run build
        env:
          # Add any environment variables your build needs
          NODE_ENV: production

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder containing built app (default for Vue)
          branch: gh-pages # The branch to deploy to